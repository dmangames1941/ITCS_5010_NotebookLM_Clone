name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Change to 'master' if your main branch is called master
  workflow_dispatch:   # Allows you to trigger the sync manually from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: dcorrih2/itcs-5010-notebooklm-clone
          hf_token: ${{ secrets.HF_TOKEN }}
